name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Also run instrumented tests on an Android emulator"
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (only when repository secrets are present)
        env:
          KEYSTORE_BASE64: ${{ secrets.HAPTICSYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hapticsync-release.jks"
            echo "HAPTICSYNC_KEYSTORE_PATH=$RUNNER_TEMP/hapticsync-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No release keystore secret; the release build will be signed with the debug key."
          fi

      - name: Engine tests (pure JVM)
        run: ./gradlew --stacktrace coreTest

      - name: Android unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Build APKs and App Bundle
        env:
          HAPTICSYNC_KEYSTORE_PASSWORD: ${{ secrets.HAPTICSYNC_KEYSTORE_PASSWORD }}
          HAPTICSYNC_KEY_ALIAS: ${{ secrets.HAPTICSYNC_KEY_ALIAS }}
          HAPTICSYNC_KEY_PASSWORD: ${{ secrets.HAPTICSYNC_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest

      - name: Upload APKs and bundle
        uses: actions/upload-artifact@v4
        with:
          name: hapticsync-builds
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapticsync-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --stacktrace connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapticsync-instrumented-reports
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore
