name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Also run instrumented tests on an Android emulator"
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (only when repository secrets are present)
        env:
          KEYSTORE_BASE64: ${{ secrets.HAPTICSYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hapticsync-release.jks"
            echo "HAPTICSYNC_KEYSTORE_PATH=$RUNNER_TEMP/hapticsync-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No release keystore secret; the release build will be signed with the debug key."
          fi

      - name: Build, test and lint (engine JVM tests, Android unit tests, lint, APKs, bundle)
        env:
          HAPTICSYNC_KEYSTORE_PASSWORD: ${{ secrets.HAPTICSYNC_KEYSTORE_PASSWORD }}
          HAPTICSYNC_KEY_ALIAS: ${{ secrets.HAPTICSYNC_KEY_ALIAS }}
          HAPTICSYNC_KEY_PASSWORD: ${{ secrets.HAPTICSYNC_KEY_PASSWORD }}
        # Explicit bash enables `-o pipefail`, so a Gradle failure is not masked by `tee`.
        shell: bash
        run: >-
          ./gradlew --continue
          coreTest testDebugUnitTest lintDebug
          assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest
          2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Verify the app requests only the vibration permission
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*release*' -print -quit)
          if [ -z "$manifest" ]; then
            echo "::error::Merged release manifest not found."
            exit 1
          fi
          echo "Merged manifest: $manifest"
          tr '\n' ' ' < "$manifest" | { grep -o '<uses-permission[^>]*>' || true; } | { grep -o 'android:name="[^"]*"' || true; } \
            | sed 's/android:name="//; s/"$//' | sort -u | tee "$RUNNER_TEMP/permissions.txt"
          if [ "$(cat "$RUNNER_TEMP/permissions.txt")" != "android.permission.VIBRATE" ]; then
            echo "::error::The merged manifest must request exactly android.permission.VIBRATE (found the list above)."
            exit 1
          fi

      - name: Summarize failures
        if: failure()
        run: |
          echo "::group::Compiler, test and lint errors"
          grep -E '^e: |^w: .*(deprecat|unchecked)|What went wrong|FAILED$|Lint found|Error: ' "$RUNNER_TEMP/gradle.log" | sort -u | head -250 || true
          for f in $(find . -path '*/build/reports/lint-results-*.txt' 2>/dev/null); do echo "== $f"; head -150 "$f"; done
          for f in $(find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null); do grep -l '<failure' "$f" >/dev/null 2>&1 && { echo "== $f"; grep -A8 '<failure' "$f" | head -60; }; done
          echo "::endgroup::"

      - name: Upload APKs and bundle
        uses: actions/upload-artifact@v4
        with:
          name: hapticsync-builds
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapticsync-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Keep emulator audio enabled (the default options include -noaudio): the PCM tap test
          # plays real audio through Media3's AudioTrack sink.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: ./gradlew --continue connectedDebugAndroidTest
      - name: Summarize instrumented results
        if: always()
        run: |
          # Result file names contain spaces (device names), so iterate NUL-delimited.
          find . -path '*/build/outputs/androidTest-results/connected/*' -name 'TEST-*.xml' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              echo "== $f"
              grep -o '<testsuite [^>]*' "$f" | grep -o 'tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"\|skipped="[0-9]*"' | tr '\n' ' ' || true
              echo
              grep -o '<testcase name="[^"]*" classname="[^"]*"' "$f" | sed 's/<testcase name="\([^"]*\)" classname="\([^"]*\)"/  \2.\1/' || true
              grep -A6 '<failure' "$f" | head -40 || true
            done
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapticsync-instrumented-reports
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore
